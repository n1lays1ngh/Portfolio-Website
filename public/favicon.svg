<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66fcf1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a29e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle (Optional - Remove if you want transparent) -->
  <circle cx="256" cy="256" r="240" fill="#0b0c10" stroke="url(#grad1)" stroke-width="20" />

  <!-- The "N" Monogram with Code Brackets -->
  <g transform="translate(106, 106) scale(0.6)">
     <!-- Left Bracket < -->
     <path d="M100 50 L20 250 L100 450" fill="none" stroke="url(#grad1)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
     
     <!-- Right Bracket > -->
     <path d="M400 50 L480 250 L400 450" fill="none" stroke="url(#grad1)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>

     <!-- The N Slash -->
     <path d="M160 100 L340 400" fill="none" stroke="url(#grad1)" stroke-width="50" stroke-linecap="round" />
     
     <!-- N Vertical Lines -->
     <line x1="160" y1="100" x2="160" y2="400" stroke="url(#grad1)" stroke-width="40" stroke-linecap="round" />
     <line x340" y1="100" x2="340" y2="400" stroke="url(#grad1)" stroke-width="40" stroke-linecap="round" />
  </g>
</svg>

